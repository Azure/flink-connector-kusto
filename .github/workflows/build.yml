# This workflow will install the dependencies, run tests and lint every push

name: Build Java

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
jobs:
  build:
    runs-on: ubuntu-latest
    environment: build
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
      id-token: write
    strategy:
      matrix:
        java: ['11']
    name: Java ${{ matrix.java }}
    steps:
      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.APP_ID }}
          tenant-id: ${{ secrets.AUTH_ID }}
          subscription-id: ${{ secrets.SUBSCRIPTION_ID }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup java ${{ matrix.java }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'adopt'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Run tests
        run: mvn clean compile test-compile formatter:validate test integration-test verify -Dcluster=${{ secrets.CLUSTER_URL }} -Ddatabase=${{ secrets.DATABASE_NAME }} -U -am
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
        if: always()
        with:
          files: |
            connector-core/target/failsafe-reports/TEST*.xml
            connector-core/target/surefire-reports/TEST*.xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1