# This workflow will install the dependencies, run tests and lint every push

name: Build Java

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
jobs:
  build:
    runs-on: ubuntu-latest
    environment: build
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
      id-token: write
    strategy:
      matrix:
        java: ['11']
    name: Java ${{ matrix.java }}
    steps:
      - name: Azure login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.APP_ID }}
          tenant-id: ${{ secrets.AUTH_ID }}
          subscription-id: ${{ secrets.SUBSCRIPTION_ID }}
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
      - name: Setup java ${{ matrix.java }}
        uses: actions/setup-java@e9fbacdec3bb3b6036605a3e6f7995d66773a8c6 # v3.14.2
        with:
          distribution: 'adopt'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Run tests
        run: mvn clean compile test-compile formatter:validate test integration-test verify -Dcluster=${{ secrets.CLUSTER_URL }} -Ddatabase=${{ secrets.DATABASE_NAME }} -U -am
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        if: always()
        with:
          files: |
            connector-core/target/failsafe-reports/TEST*.xml
            connector-core/target/surefire-reports/TEST*.xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3.1.6